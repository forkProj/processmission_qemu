# SPDX-License-Identifier: MIT
name: Chinese Documentation Pages

on:
  push:
    branches: [docs-zh]
  pull_request:
    branches: [docs-zh]
    paths: ["docs/**", ".github/workflows/docs-zh-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-zh-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements-zh.txt
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements-zh.txt
      - name: Test translation references and code preservation
        run: python -m unittest discover -s docs/translations/tools/tests
      - name: Build and validate complete Chinese documentation
        env:
          QEMU_DOCS_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python docs/translations/tools/build-zh --jobs 2
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs/_build/zh/html
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/docs-zh'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Chinese documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
